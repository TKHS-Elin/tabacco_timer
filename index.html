<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10151c">
    <meta name="description" content="ブザーとチャイムが交互に鳴る5分タイマー">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <title>5分タイマー</title>
  </head>
  <body>
    <main class="stopwatch" id="timer-app" aria-label="5分タイマー。画面をタップして開始または停止" role="button" tabindex="0">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">5</div>
        <div>
          <p class="eyebrow">INTERVAL TIMER</p>
          <h1>5分タイマー</h1>
        </div>
      </header>

      <section class="timer-panel" aria-label="残り時間">
        <p class="timer-label" id="timer-status" aria-live="polite">待機中</p>
        <p class="timer" role="timer" aria-label="残り時間">
          <span id="time-main">05:00</span>
        </p>
        <div class="timer-rule" aria-hidden="true"><span></span></div>
      </section>

      <section class="phase-panel" aria-live="polite">
        <span class="phase-indicator" aria-hidden="true"></span>
        <p class="phase-name" id="phase-name">次はブザー</p>
        <p class="tap-hint" id="tap-hint">画面をタップして開始</p>
      </section>

      <p class="availability-note" id="availability-note" role="status" aria-live="polite"></p>

      <footer class="app-footer">タップで開始・停止。アプリ表示中は画面を点灯したままにします。</footer>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
